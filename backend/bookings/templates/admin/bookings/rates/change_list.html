{% extends "admin/change_list.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
  <li>
    <a href="{% url opts|admin_urlname:'export_xlsx' %}">Download Excel</a>
  </li>
  {% if has_rate_import_permission %}
    <li>
      <a href="{% url opts|admin_urlname:'import_xlsx' %}" class="addlink">Import Excel</a>
    </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
