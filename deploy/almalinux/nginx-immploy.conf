upstream immploy_app {
    # Two independently restartable local backends. Keep total concurrency at
    # four threads until production CPU, memory and PostgreSQL load are measured.
    least_conn;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name booking.immploy.com 10.0.0.99 10.0.1.101;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name booking.immploy.com 10.0.0.99 10.0.1.101;

    ssl_certificate /etc/pki/tls/certs/immploy-server.crt;
    ssl_certificate_key /etc/pki/tls/private/immploy-server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /var/www/immploy-static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ^~ /media/ {
        return 404;
    }

    location ^~ /private-media/ {
        return 404;
    }

    # Fail closed if a deployment ever copies source or source-map files into
    # a public directory. The browser receives only the production bundle.
    location ~* \.(?:map|py|pyc|pyo|ts|tsx)$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://immploy_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        # Retry only requests Nginx considers safe/idempotent; booking mutations
        # must never be replayed after an ambiguous upstream failure.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    root /var/www/immploy;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
